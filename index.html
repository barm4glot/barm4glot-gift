<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Plush Pepe Crash</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Socket.io Client Library -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f0919; color: #ffffff; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .game-card { width: 100%; max-width: 420px; background: #1a112b; border-radius: 16px; padding: 15px; border: 1px solid #2e1d4a; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        
        .canvas-container { position: relative; width: 100%; height: 260px; background: #120a1f; border-radius: 12px; overflow: hidden; border: 1px solid #281743; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .status-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
        .multiplier { font-size: 42px; font-weight: 800; color: #a855f7; text-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }
        .multiplier.crashed { color: #ef4444; text-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }
        .timer { font-size: 16px; color: #9ca3af; margin-top: 5px; }

        .controls { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; gap: 10px; }
        input[type="number"] { flex: 1; background: #120a1f; border: 1px solid #3b2261; border-radius: 8px; color: #fff; padding: 12px; font-size: 16px; outline: none; }
        
        .btn { background: linear-gradient(135deg, #9333ea, #6b21a8); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-cashout { background: linear-gradient(135deg, #22c55e, #15803d); }
        .btn:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

        .bets-list { margin-top: 15px; background: #120a1f; border-radius: 10px; padding: 10px; max-height: 120px; overflow-y: auto; border: 1px solid #281743; }
        .bet-item { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #1a112b; }
        .bet-item.win { color: #4ade80; }
    </style>
</head>
<body>

<div class="game-card">
    <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
        <div class="status-overlay">
            <div id="multiplierText" class="multiplier">1.00x</div>
            <div id="timerText" class="timer">Ожидание...</div>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="number" id="betAmount" value="10" min="1" placeholder="Сумма ставки">
        </div>
        <button id="actionBtn" class="btn">Сделать ставку</button>
    </div>

    <div class="bets-list" id="betsList">
        <div style="color: #6b7280; text-align: center; font-size: 12px;">Ставок пока нет</div>
    </div>
</div>

<script>
    // 1. Инициализация Telegram Web App
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();
    const username = tg?.initDataUnsafe?.user?.first_name || "Игрок_" + Math.floor(Math.random() * 1000);

    // 2. Подключение к бэкенду (укажите адрес вашего сервера Node.js)
    const SOCKET_URL = "http://localhost:3000"; 
    const socket = io(SOCKET_URL);

    // 3. Canvas & Графика
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();

    const pepeImg = new Image();
    pepeImg.src = 'pepe.png'; // Ваше изображение Plush Pepe

    let currentMultiplier = 1.00;
    let gameState = 'WAITING';
    let myBetPlaced = false;
    let hasCashedOut = false;

    // DOM Элементы
    const multText = document.getElementById('multiplierText');
    const timerText = document.getElementById('timerText');
    const actionBtn = document.getElementById('actionBtn');
    const betInput = document.getElementById('betAmount');
    const betsList = document.getElementById('betsList');

    // Отрисовка траектории и Plush Pepe
    function drawGraph(mult) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState !== 'IN_PROGRESS' && gameState !== 'CRASHED') return;

        const progress = Math.min((mult - 1) / 4, 1); // Масштаб графика
        const startX = 30;
        const startY = canvas.height - 30;
        const targetX = startX + progress * (canvas.width - 80);
        const targetY = startY - progress * (canvas.height - 80);

        // Линия графика
        ctx.beginPath();
        ctx.strokeStyle = gameState === 'CRASHED' ? '#ef4444' : '#a855f7';
        ctx.lineWidth = 4;
        ctx.moveTo(startX, startY);
        ctx.quadraticCurveTo(startX + (targetX - startX) / 2, startY, targetX, targetY);
        ctx.stroke();

        // Plush Pepe на конце линии
        if (pepeImg.complete && gameState === 'IN_PROGRESS') {
            ctx.drawImage(pepeImg, targetX - 25, targetY - 25, 50, 50);
        }
    }

    // 4. WebSocket события от сервера
    socket.on('round_waiting', (data) => {
        gameState = 'WAITING';
        myBetPlaced = false;
        hasCashedOut = false;
        multText.className = 'multiplier';
        multText.innerText = '1.00x';
        timerText.innerText = `До старта: ${data.countdown}с`;
        
        actionBtn.innerText = "Сделать ставку";
        actionBtn.className = "btn";
        actionBtn.disabled = false;
        betInput.disabled = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    socket.on('round_countdown', (data) => {
        timerText.innerText = `До старта: ${data.countdown}с`;
    });

    socket.on('round_start', () => {
        gameState = 'IN_PROGRESS';
        timerText.innerText = "ВЗЛЁТ!";
        betInput.disabled = true;

        if (myBetPlaced) {
            actionBtn.innerText = "ЗАБРАТЬ";
            actionBtn.className = "btn btn-cashout";
            actionBtn.disabled = false;
        } else {
            actionBtn.disabled = true;
        }
    });

    socket.on('multiplier_update', (data) => {
        currentMultiplier = data.multiplier;
        multText.innerText = currentMultiplier.toFixed(2) + 'x';
        drawGraph(currentMultiplier);
    });

    socket.on('round_crash', (data) => {
        gameState = 'CRASHED';
        multText.className = 'multiplier crashed';
        multText.innerText = 'CRASH ' + data.crashPoint.toFixed(2) + 'x';
        timerText.innerText = 'Раунд завершен';
        actionBtn.disabled = true;
        drawGraph(data.crashPoint);
    });

    socket.on('cashout_success', (data) => {
        hasCashedOut = true;
        actionBtn.disabled = true;
        actionBtn.innerText = `Забрано: ${data.profit}`;
    });

    socket.on('bets_update', (bets) => {
        betsList.innerHTML = bets.map(b => `
            <div class="bet-item ${b.cashedOut ? 'win' : ''}">
                <span>${b.username}</span>
                <span>${b.amount} ➔ ${b.cashedOut ? b.profit + ' (' + b.multiplier + 'x)' : 'В игре'}</span>
            </div>
        `).join('');
    });

    // 5. Обработка нажатия на кнопку
    actionBtn.addEventListener('click', () => {
        if (gameState === 'WAITING' && !myBetPlaced) {
            const amount = parseFloat(betInput.value);
            if (amount > 0) {
                socket.emit('place_bet', { username, amount });
                myBetPlaced = true;
                actionBtn.innerText = "Ставка принята";
                actionBtn.disabled = true;
            }
        } else if (gameState === 'IN_PROGRESS' && myBetPlaced && !hasCashedOut) {
            socket.emit('cashout');
        }
    });
</script>
</body>
</html>
