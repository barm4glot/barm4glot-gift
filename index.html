<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plush Gift - Telegram Stars Games</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#09070f',
                        cardBg: '#130f1e',
                        cardBorder: '#261b3b',
                        accentPrimary: '#ff007f',
                        accentSecondary: '#ff8800',
                        accentGold: '#ffd700',
                        accentSuccess: '#10b981',
                        accentDanger: '#f43f5e',
                        tgStar: '#ffc107'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'neon-pink': '0 0 25px rgba(255, 0, 127, 0.45)',
                        'neon-gold': '0 0 25px rgba(255, 215, 0, 0.45)',
                        'neon-green': '0 0 25px rgba(16, 185, 129, 0.45)',
                        'neon-red': '0 0 25px rgba(244, 63, 94, 0.45)',
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #09070f;
            color: #f3f4f6;
            user-select: none;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        .gradient-text {
            background: linear-gradient(135deg, #ff007f 0%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gradient-button {
            background: linear-gradient(135deg, #ff007f 0%, #ff5500 100%);
            transition: all 0.2s ease;
        }

        .gradient-button:hover, .gradient-button:active {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }

        .gradient-button-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            transition: all 0.2s ease;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #130f1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #261b3b;
            border-radius: 4px;
        }

        .canvas-container {
            position: relative;
            background: radial-gradient(circle at center, rgba(38, 27, 59, 0.6) 0%, rgba(9, 7, 15, 0.98) 100%);
        }

        .bg-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 0, 127, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 0, 127, 0.06) 1px, transparent 1px);
        }

        .pill-anim {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .glow-danger {
            text-shadow: 0 0 20px rgba(244, 63, 94, 0.7);
        }
        
        .glow-success {
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.7);
        }
        
        .glow-multiplier {
            text-shadow: 0 0 30px rgba(255, 0, 127, 0.7);
        }

        /* Mines Tile Animations */
        .mine-tile {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .mine-tile:active {
            transform: scale(0.92);
        }

        .mine-tile.revealed-gift {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.1) 100%);
            border-color: #10b981 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            animation: popIn 0.35s ease;
        }

        .mine-tile.revealed-bomb {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.3) 0%, rgba(159, 18, 57, 0.2) 100%);
            border-color: #f43f5e !important;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.5);
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* Tab Navigation Active Indicator */
        .nav-tab.active {
            color: #ff007f;
            border-bottom: 2px solid #ff007f;
            background: rgba(255, 0, 127, 0.08);
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col justify-between pb-16">

    <!-- Header Navigation Bar -->
    <header class="border-b border-cardBorder bg-cardBg/90 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
            
            <!-- App Logo & TG Profile -->
            <div class="flex items-center gap-2.5">
                <div id="userAvatar" class="w-10 h-10 rounded-xl gradient-button flex items-center justify-center text-white text-lg font-black shadow-neon-pink overflow-hidden">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-wider text-white flex items-center gap-1.5 leading-none">
                        PLUSH<span class="gradient-text font-black">GIFT</span>
                    </h1>
                    <p id="userNameDisplay" class="text-[11px] text-purple-300/70 font-semibold mt-0.5 truncate max-w-[120px]">@Игрок</p>
                </div>
            </div>

            <!-- Telegram Stars Balance -->
            <div class="flex items-center gap-2">
                <div class="bg-darkBg/90 border border-cardBorder px-3 py-1.5 rounded-xl flex items-center gap-2">
                    <div class="flex flex-col items-end">
                        <span class="text-[9px] text-purple-300/60 font-bold uppercase tracking-wider">Звёзды</span>
                        <span id="userBalance" class="text-sm font-black text-amber-300 tracking-tight flex items-center gap-1">
                            ⭐ 1,000
                        </span>
                    </div>
                    <button id="resetBalanceBtn" title="Пополнить Telegram Звёзды" class="bg-cardBorder hover:bg-purple-900/50 text-amber-300 p-1.5 rounded-lg transition text-xs">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab Bar Controls -->
        <nav class="flex border-t border-cardBorder bg-darkBg/90 text-xs font-bold text-gray-400">
            <button class="nav-tab active flex-1 py-2.5 text-center flex items-center justify-center gap-1.5 transition" data-tab="tab-crash">
                <i class="fa-solid fa-rocket text-sm"></i> Краш
            </button>
            <button class="nav-tab flex-1 py-2.5 text-center flex items-center justify-center gap-1.5 transition" data-tab="tab-mines">
                <i class="fa-solid fa-bomb text-sm"></i> Мины
            </button>
            <button class="nav-tab flex-1 py-2.5 text-center flex items-center justify-center gap-1.5 transition" data-tab="tab-live">
                <i class="fa-solid fa-users text-sm"></i> Онлайн Игроки
            </button>
            <button class="nav-tab flex-1 py-2.5 text-center flex items-center justify-center gap-1.5 transition" data-tab="tab-leaderboard">
                <i class="fa-solid fa-trophy text-sm"></i> Топ
            </button>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-3 py-3 w-full flex-grow flex flex-col gap-4">

        <!-- ================= TAB 1: CRASH GAME ================= -->
        <div id="tab-crash" class="tab-content flex flex-col gap-3">
            
            <!-- History Bar -->
            <div class="bg-cardBg border border-cardBorder rounded-xl p-2 flex items-center gap-2 overflow-hidden">
                <div class="text-[10px] font-extrabold text-purple-300/70 uppercase tracking-wider flex items-center gap-1 px-1 border-r border-cardBorder shrink-0">
                    <i class="fa-solid fa-clock-rotate-left text-accentPrimary"></i> История
                </div>
                <div id="crashHistoryBar" class="flex items-center gap-1.5 overflow-x-auto py-0.5 scrollbar-none w-full">
                    <!-- Dynamic Past Multipliers -->
                </div>
            </div>

            <!-- Canvas / Graph Container -->
            <div class="canvas-container bg-cardBg border border-cardBorder rounded-2xl p-4 shadow-xl relative overflow-hidden bg-grid h-[280px] sm:h-[320px] flex flex-col justify-between">
                
                <!-- Status Header inside Canvas -->
                <div class="flex justify-between items-center z-10">
                    <div id="gameStatusBadge" class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-gray-800/80 text-gray-300 border border-gray-700 backdrop-blur-sm flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                        <span>Ожидание</span>
                    </div>
                    <div id="livePayoutPreview" class="text-[11px] font-semibold text-gray-400 hidden backdrop-blur-sm bg-darkBg/80 px-2.5 py-1 rounded-lg border border-cardBorder">
                        Приз: <span id="livePayoutValue" class="text-amber-300 font-bold">⭐ 0</span>
                    </div>
                </div>

                <!-- Main Canvas Graph -->
                <canvas id="crashCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>

                <!-- Dynamic Multiplier Text -->
                <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-10">
                    <div id="multiplierDisplay" class="text-5xl sm:text-6xl font-black text-white tracking-tight glow-multiplier transition-all">
                        1.00x
                    </div>
                    <p id="subStatusText" class="text-xs font-semibold text-purple-200/60 mt-1 uppercase tracking-widest h-5">
                        Сделайте ставку в ⭐
                    </p>
                </div>

                <!-- Live Cashout Notification Toast -->
                <div id="toastMessage" class="absolute top-12 left-1/2 -translate-x-1/2 z-20 transition-all duration-300 opacity-0 transform -translate-y-3 pointer-events-none w-[90%]">
                    <div class="bg-amber-500/90 text-darkBg font-bold px-4 py-2 rounded-xl shadow-neon-gold backdrop-blur-md flex items-center justify-center gap-2 border border-amber-300 text-center">
                        <i class="fa-solid fa-star text-xl text-amber-100"></i>
                        <div class="text-xs">
                            <span class="font-black" id="toastContent">Забрано ⭐ 0 (2.50x)</span>
                        </div>
                    </div>
                </div>

                <!-- Countdown Progress Bar -->
                <div class="z-10 w-full bg-darkBg/60 rounded-full h-1.5 overflow-hidden border border-cardBorder mt-auto">
                    <div id="progressBar" class="bg-accentPrimary h-full w-0 transition-all duration-100"></div>
                </div>
            </div>

            <!-- Crash Bet Controls Panel -->
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3.5 shadow-xl flex flex-col gap-3">
                
                <div class="flex items-center justify-between border-b border-cardBorder/60 pb-2">
                    <h2 class="text-xs font-bold text-white flex items-center gap-1.5 uppercase tracking-wider">
                        <i class="fa-solid fa-sliders text-accentPrimary"></i> Ставка (⭐)
                    </h2>
                    <label class="text-[10px] text-purple-300/80 font-bold flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="autoCashoutToggle" class="accent-accentPrimary w-3.5 h-3.5">
                        <span>Автовывод</span>
                    </label>
                </div>

                <!-- Bet Input & Quick Buttons -->
                <div class="grid grid-cols-12 gap-2">
                    <div class="col-span-7 relative flex items-center">
                        <span class="absolute left-3 text-amber-400 font-bold text-sm">⭐</span>
                        <input type="number" id="crashBetAmount" value="10" min="1" max="10000" step="1"
                            class="w-full bg-darkBg border border-cardBorder rounded-xl py-2 pl-8 pr-2 text-white font-black text-base focus:outline-none focus:border-accentPrimary">
                    </div>
                    
                    <div id="autoCashoutContainer" class="col-span-5 opacity-50 pointer-events-none transition-all relative flex items-center">
                        <input type="number" id="autoCashoutValue" value="2.00" min="1.01" step="0.1" 
                            class="w-full bg-darkBg border border-cardBorder rounded-xl py-2 px-2 text-white font-bold text-xs text-center focus:outline-none focus:border-accentPrimary">
                        <span class="absolute right-2 text-[10px] text-gray-500 font-bold">X</span>
                    </div>
                </div>

                <!-- Quick Buttons -->
                <div class="grid grid-cols-4 gap-1.5">
                    <button class="quick-crash-bet bg-darkBg hover:bg-cardBorder text-amber-300 font-bold py-1.5 rounded-lg text-xs border border-cardBorder" data-action="add" data-value="10">+10 ⭐</button>
                    <button class="quick-crash-bet bg-darkBg hover:bg-cardBorder text-amber-300 font-bold py-1.5 rounded-lg text-xs border border-cardBorder" data-action="add" data-value="50">+50 ⭐</button>
                    <button class="quick-crash-bet bg-darkBg hover:bg-cardBorder text-amber-300 font-bold py-1.5 rounded-lg text-xs border border-cardBorder" data-action="add" data-value="100">+100 ⭐</button>
                    <button class="quick-crash-bet bg-darkBg hover:bg-cardBorder text-amber-300 font-bold py-1.5 rounded-lg text-xs border border-cardBorder" data-action="max">МАКС</button>
                </div>

                <!-- Action Button -->
                <button id="crashActionButton" 
                    class="gradient-button w-full py-3.5 rounded-xl text-white font-black text-base tracking-wider uppercase shadow-neon-pink flex items-center justify-center gap-2">
                    <i class="fa-solid fa-star"></i> <span>СДЕЛАТЬ СТАВКУ</span>
                </button>
            </div>

            <!-- Live Round Players Widget -->
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3 shadow-xl">
                <div class="flex justify-between items-center mb-2 pb-1.5 border-b border-cardBorder/60">
                    <span class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Игроки в текущем раунде
                    </span>
                    <span id="livePlayersCount" class="text-[11px] font-black text-amber-300">0 участников</span>
                </div>
                <div id="liveCrashPlayersList" class="flex flex-col gap-1.5 max-h-36 overflow-y-auto pr-1">
                    <!-- Dynamic Live Bets Render -->
                </div>
            </div>

        </div>

        <!-- ================= TAB 2: MINES GAME ================= -->
        <div id="tab-mines" class="tab-content hidden flex-col gap-3">
            
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-3.5 shadow-xl flex flex-col gap-3">
                <div class="flex justify-between items-center border-b border-cardBorder/60 pb-2">
                    <h2 class="text-xs font-bold text-white flex items-center gap-1.5 uppercase tracking-wider">
                        <i class="fa-solid fa-bomb text-rose-500"></i> Игра "Мины"
                    </h2>
                    <span id="minesMultiplierBadge" class="text-xs bg-darkBg text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-500/30 font-extrabold">
                        1.00x
                    </span>
                </div>

                <!-- Mines 5x5 Grid -->
                <div id="minesGrid" class="grid grid-cols-5 gap-2 my-1 aspect-square w-full max-w-[320px] mx-auto">
                    <!-- 25 Mines Tiles Dynamically Rendered -->
                </div>

                <!-- Mines Controls & Settings -->
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-purple-200/70 uppercase">Ставка (⭐)</label>
                        <div class="relative flex items-center">
                            <span class="absolute left-2.5 text-amber-400 font-bold text-xs">⭐</span>
                            <input type="number" id="minesBetAmount" value="10" min="1" max="10000" step="1"
                                class="w-full bg-darkBg border border-cardBorder rounded-xl py-2 pl-7 pr-2 text-white font-bold text-sm focus:outline-none focus:border-accentPrimary">
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-purple-200/70 uppercase">Кол-во Мин</label>
                        <select id="minesCountSelect" class="w-full bg-darkBg border border-cardBorder rounded-xl py-2 px-2 text-rose-400 font-extrabold text-sm focus:outline-none focus:border-accentPrimary">
                            <option value="1">1 Мина (96% шанс)</option>
                            <option value="3" selected>3 Мины (88% шанс)</option>
                            <option value="5">5 Мин (80% шанс)</option>
                            <option value="10">10 Мин (60% шанс)</option>
                            <option value="15">15 Мин (40% шанс)</option>
                            <option value="20">20 Мин (20% шанс)</option>
                            <option value="24">24 Мины (4% шанс)</option>
                        </select>
                    </div>
                </div>

                <!-- Mines Action Button -->
                <button id="minesActionButton" 
                    class="gradient-button w-full py-3.5 rounded-xl text-white font-black text-base tracking-wider uppercase shadow-neon-pink flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> <span>НАЧАТЬ ИГРУ</span>
                </button>
            </div>

        </div>

        <!-- ================= TAB 3: LIVE BETS FEED ================= -->
        <div id="tab-live" class="tab-content hidden flex-col gap-3">
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-4 shadow-xl">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-cardBorder">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-accentGold"></i> Онлайн Ставки В Реальном Времени
                    </h3>
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold">
                        В эфире
                    </span>
                </div>
                
                <div id="globalLiveBetsList" class="flex flex-col gap-2 max-h-[460px] overflow-y-auto pr-1">
                    <!-- Global Live Feed Dynamically Rendered -->
                </div>
            </div>
        </div>

        <!-- ================= TAB 4: LEADERBOARD ================= -->
        <div id="tab-leaderboard" class="tab-content hidden flex-col gap-3">
            <div class="bg-cardBg border border-cardBorder rounded-2xl p-4 shadow-xl">
                <div class="flex justify-between items-center mb-3 pb-2 border-b border-cardBorder">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-trophy text-accentGold"></i> Топ Победителей (⭐)
                    </h3>
                    <span class="text-[10px] text-purple-300/60 font-semibold">
                        За всё время
                    </span>
                </div>

                <div id="leaderboardList" class="flex flex-col gap-2">
                    <!-- Dynamic Leaderboard Items -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Stats / Audio Toggle -->
    <footer class="fixed bottom-0 left-0 right-0 border-t border-cardBorder py-2 bg-cardBg/95 backdrop-blur-md z-40">
        <div class="max-w-md mx-auto px-4 text-xs text-purple-300/60 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span id="globalOnlineCounter" class="font-bold text-gray-300 text-[11px]">Онлайн: 1,482 чел.</span>
            </div>
            
            <button id="soundToggleBtn" class="bg-darkBg hover:bg-cardBorder text-amber-300 px-2.5 py-1 rounded-lg border border-cardBorder flex items-center gap-1.5 text-[11px] font-bold">
                <i id="soundIcon" class="fa-solid fa-volume-high"></i> <span>Звук</span>
            </button>
        </div>
    </footer>

    <script>
        /**
         * Plush Gift - Telegram Stars Multiplayer Engine
         */

        // Telegram WebApp Initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // App Configuration & State
        const CONFIG = {
            initialBalance: 1000,
            prepTimeSeconds: 5,
            tickRateMs: 30,
            growthFactor: 0.00025, // Slow, smooth curve growth
            minCrash: 1.01,
            maxCrash: 200.0,
            soundEnabled: true
        };

        // User profile info from TG or fallback
        const userProfile = {
            id: tg?.initDataUnsafe?.user?.id || Math.floor(100000 + Math.random() * 900000),
            name: tg?.initDataUnsafe?.user?.first_name 
                ? (tg.initDataUnsafe.user.first_name + (tg.initDataUnsafe.user.last_name ? ' ' + tg.initDataUnsafe.user.last_name : '')) 
                : 'Счастливчик',
            username: tg?.initDataUnsafe?.user?.username ? '@' + tg.initDataUnsafe.user.username : '@star_player'
        };

        let state = {
            balance: CONFIG.initialBalance,
            activeTab: 'tab-crash',
            
            // Crash Game State
            crash: {
                gamePhase: 'WAITING', // 'WAITING', 'RUNNING', 'CRASHED'
                multiplier: 1.00,
                crashPoint: 1.00,
                currentBet: 0,
                isBetPlaced: false,
                hasCashedOut: false,
                autoCashoutEnabled: false,
                autoCashoutMultiplier: 2.00,
                history: [1.45, 2.10, 1.12, 5.40, 1.88, 12.30, 1.05, 3.22, 1.95, 2.05],
                gameTimer: null,
                prepTimer: null,
                startTime: 0,
                particles: [],
                livePlayers: []
            },

            // Mines Game State
            mines: {
                isPlaying: false,
                betAmount: 10,
                mineCount: 3,
                revealedCount: 0,
                multiplier: 1.00,
                grid: Array(25).fill(false), // true = mine, false = gift
                revealed: Array(25).fill(false)
            },

            // Multiplayer Mock Names pool for real-time live feed simulation
            botNames: [
                'Александр @alex_star', 'Елена @elena_gift', 'Максим @max_top', 'София @sofi_stars',
                'Дмитрий @dima_crash', 'Анна @anya_plush', 'Артем @artem_win', 'Виктория @vika_star',
                'Иван @ivan_king', 'Мария @maria_gold', 'Никита @nikita_gift', 'Ольга @olga_stars'
            ],

            leaderboard: [
                { name: 'Александр @alex_star', stars: 125400, rank: 1 },
                { name: 'Елена @elena_gift', stars: 89200, rank: 2 },
                { name: 'Максим @max_top', stars: 64100, rank: 3 },
                { name: 'София @sofi_stars', stars: 45000, rank: 4 },
                { name: 'Дмитрий @dima_crash', stars: 31800, rank: 5 }
            ]
        };

        // DOM Elements Map
        const DOM = {
            userBalance: document.getElementById('userBalance'),
            userNameDisplay: document.getElementById('userNameDisplay'),
            userAvatar: document.getElementById('userAvatar'),
            resetBalanceBtn: document.getElementById('resetBalanceBtn'),
            soundToggleBtn: document.getElementById('soundToggleBtn'),
            soundIcon: document.getElementById('soundIcon'),
            
            // Tabs
            navTabs: document.querySelectorAll('.nav-tab'),
            tabContents: document.querySelectorAll('.tab-content'),

            // Crash Game
            crashHistoryBar: document.getElementById('crashHistoryBar'),
            crashCanvas: document.getElementById('crashCanvas'),
            multiplierDisplay: document.getElementById('multiplierDisplay'),

        // Canvas Context
        const ctx = DOM.crashCanvas.getContext('2d');

        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx && window.AudioContext) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playBeep(freq = 440, duration = 0.08) {
                if (!CONFIG.soundEnabled) return;
                try {
                    this.init();
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            playWin() {
                if (!CONFIG.soundEnabled) return;
                try {
                    this.init();
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } catch(e){}
            }

            playCrash() {
                if (!CONFIG.soundEnabled) return;
                try {
                    this.init();
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch(e){}
            }
        }

        const soundFX = new SoundFX();

            if (tg && tg.HapticFeedback) {

        function generateCrashPoint() {
            const e = 100;
            const r = Math.random() * e;
            if (r < 3) return 1.00;
            const h = Math.random();
            let crash = (100 / (100 - (h * 97)));
            crash = Math.max(CONFIG.minCrash, Math.min(CONFIG.maxCrash, crash));
            return parseFloat(crash.toFixed(2));
        }

        function resizeCanvas() {
            const rect = DOM.crashCanvas.getBoundingClientRect();

        function createExplosion(x, y) {
            state.crash.particles = [];
            for (let i = 0; i < 35; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                state.crash.particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 2,
                    color: Math.random() > 0.5 ? '#ffc107' : '#ff007f',
                    alpha: 1
                });
            }
        }

        function drawCanvas() {
            const width = DOM.crashCanvas.width;
            const height = DOM.crashCanvas.height;
            if (!width || !height) return;

            ctx.clearRect(0, 0, width, height);

            const paddingLeft = 30;
            const paddingBottom = 30;
            const graphWidth = width - paddingLeft - 20;
            const graphHeight = height - paddingBottom - 20;

            // Axis line
            ctx.beginPath();
            ctx.strokeStyle = '#261b3b';
            ctx.lineWidth = 1.5;
            ctx.moveTo(paddingLeft, height - paddingBottom);
            ctx.lineTo(width, height - paddingBottom);
            ctx.stroke();

            if (state.crash.gamePhase === 'RUNNING' || state.crash.gamePhase === 'CRASHED') {
                const progress = Math.min(1, (state.crash.multiplier - 1) / 5);
                const endX = paddingLeft + (graphWidth * Math.min(1, (Date.now() - state.crash.startTime) / 8000));
                const endY = (height - paddingBottom) - (graphHeight * Math.min(0.85, progress));

                const gradient = ctx.createLinearGradient(0, 0, 0, height);
                if (state.crash.gamePhase === 'CRASHED') {
                    gradient.addColorStop(0, 'rgba(244, 63, 94, 0.25)');
                    gradient.addColorStop(1, 'rgba(244, 63, 94, 0.0)');
                } else {
                    gradient.addColorStop(0, 'rgba(255, 0, 127, 0.25)');
                    gradient.addColorStop(1, 'rgba(255, 0, 127, 0.0)');
                }

                ctx.beginPath();
                ctx.moveTo(paddingLeft, height - paddingBottom);
                const controlX = paddingLeft + (endX - paddingLeft) * 0.5;
                const controlY = height - paddingBottom;
                ctx.quadraticCurveTo(controlX, controlY, endX, endY);
                ctx.lineTo(endX, height - paddingBottom);
                ctx.closePath();
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(paddingLeft, height - paddingBottom);
                ctx.quadraticCurveTo(controlX, controlY, endX, endY);
                ctx.strokeStyle = state.crash.gamePhase === 'CRASHED' ? '#f43f5e' : '#ff007f';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (state.crash.gamePhase === 'RUNNING') {
                    ctx.save();
                    ctx.translate(endX, endY);
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (state.crash.gamePhase === 'CRASHED') {
                    state.crash.particles.forEach((p) => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.02;
                        if (p.alpha > 0) {
                            ctx.save();
                            ctx.globalAlpha = p.alpha;
                            ctx.fillStyle = p.color;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }
                    });
                }
            }
        }

        function generateLivePlayers() {
            const count = Math.floor(Math.random() * 5) + 4;
            const players = [];

            // Add user if bet placed
            if (state.crash.isBetPlaced) {
                players.push({
                    name: userProfile.name,
                    bet: state.crash.currentBet,
                    cashedOut: state.crash.hasCashedOut,
                    cashoutMult: state.crash.multiplier,
                    isUser: true
                });
            }

            for (let i = 0; i < count; i++) {
                const name = state.botNames[Math.floor(Math.random() * state.botNames.length)];
                const bet = [10, 25, 50, 100, 250, 500][Math.floor(Math.random() * 6)];
                players.push({
                    name: name,
                    bet: bet,
                    cashedOut: false,
                    cashoutMult: 0,
                    targetMult: parseFloat((1.1 + Math.random() * 4).toFixed(2)),
                    isUser: false
                });
            }

            state.crash.livePlayers = players;
            renderLiveCrashPlayers();
        }

        function startWaitingPhase() {
            state.crash.gamePhase = 'WAITING';
            state.crash.multiplier = 1.00;
            state.crash.hasCashedOut = false;

            DOM.gameStatusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span> Прием ставок`;
            DOM.gameStatusBadge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-amber-500/10 text-amber-400 border border-amber-500/30 backdrop-blur-sm flex items-center gap-1.5";
            DOM.multiplierDisplay.textContent = "1.00x";
            DOM.multiplierDisplay.className = "text-5xl sm:text-6xl font-black text-white tracking-tight glow-multiplier transition-all";
            DOM.subStatusText.textContent = "Следующий взлет скоро...";
            DOM.livePayoutPreview.classList.add('hidden');

            generateLivePlayers();
            updateCrashActionButton();

            let timeLeft = CONFIG.prepTimeSeconds * 1000;
            const interval = 50;

            clearInterval(state.crash.prepTimer);
            state.crash.prepTimer = setInterval(() => {
                timeLeft -= interval;
                const percentage = (timeLeft / (CONFIG.prepTimeSeconds * 1000)) * 100;
                DOM.progressBar.style.width = `${Math.max(0, percentage)}%`;

                if (timeLeft <= 0) {
                    clearInterval(state.crash.prepTimer);
                    startRunPhase();
                }
            }, interval);
        }

        function startRunPhase() {
            state.crash.gamePhase = 'RUNNING';
            state.crash.crashPoint = generateCrashPoint();
            state.crash.startTime = Date.now();
            state.crash.multiplier = 1.00;

            DOM.gameStatusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> В Полёте`;
            DOM.gameStatusBadge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 backdrop-blur-sm flex items-center gap-1.5";
            DOM.subStatusText.textContent = "Заберите Звёзды!";
            DOM.progressBar.style.width = '0%';

            if (state.crash.isBetPlaced && !state.crash.hasCashedOut) {
                DOM.livePayoutPreview.classList.remove('hidden');
            }

            updateCrashActionButton();

            clearInterval(state.crash.gameTimer);
            state.crash.gameTimer = setInterval(() => {
                const elapsed = (Date.now() - state.crash.startTime) / 1000;
                
                // Slow, smooth growth formula
                const expVal = Math.pow(Math.E, CONFIG.growthFactor * elapsed * 1000);
                const linearVal = 0.05 * elapsed;
                state.crash.multiplier = parseFloat((1 + linearVal + (expVal - 1) * 0.4).toFixed(2));

                DOM.multiplierDisplay.textContent = state.crash.multiplier.toFixed(2) + 'x';

                if (state.crash.isBetPlaced && !state.crash.hasCashedOut) {
                    const currentWin = state.crash.currentBet * state.crash.multiplier;
                    DOM.livePayoutValue.textContent = formatStars(currentWin);

                    if (state.crash.autoCashoutEnabled && state.crash.multiplier >= state.crash.autoCashoutMultiplier) {
                        cashOutCrash();
                    }
                }

                // Simulate Live Players Cashing out
                state.crash.livePlayers.forEach(p => {
                    if (!p.cashedOut && p.targetMult && state.crash.multiplier >= p.targetMult) {
                        p.cashedOut = true;
                        p.cashoutMult = state.crash.multiplier;
                        addGlobalLiveFeedItem(p.name, 'Краш', p.bet, p.cashoutMult, p.bet * p.cashoutMult);
                    }
                });
                renderLiveCrashPlayers();

                if (state.crash.multiplier >= state.crash.crashPoint) {
                    triggerCrash();
                }

                drawCanvas();
            }, CONFIG.tickRateMs);
        }

        function triggerCrash() {
            clearInterval(state.crash.gameTimer);
            state.crash.gamePhase = 'CRASHED';
            soundFX.playCrash();
            triggerHaptic('notification', 'error');

            const rect = DOM.crashCanvas.getBoundingClientRect();
            createExplosion(rect.width * 0.75, rect.height * 0.3);

            DOM.multiplierDisplay.textContent = state.crash.multiplier.toFixed(2) + 'x';
            DOM.multiplierDisplay.className = "text-5xl sm:text-6xl font-black text-rose-500 tracking-tight glow-danger transition-all";
            
            DOM.gameStatusBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> Взрыв`;
            DOM.gameStatusBadge.className = "px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-rose-500/10 text-rose-400 border border-rose-500/30 backdrop-blur-sm flex items-center gap-1.5";
            
            DOM.subStatusText.textContent = "ПОДАРОК УЛЕТЕЛ!";
            DOM.livePayoutPreview.classList.add('hidden');

            if (state.crash.isBetPlaced && !state.crash.hasCashedOut) {
                addGlobalLiveFeedItem(userProfile.name, 'Краш', state.crash.currentBet, state.crash.multiplier, 0);
                state.crash.isBetPlaced = false;
            } else if (state.crash.isBetPlaced && state.crash.hasCashedOut) {
                state.crash.isBetPlaced = false;
            }

            state.crash.history.unshift(state.crash.multiplier);
            renderCrashHistory();
            updateBalanceDisplay();
            updateCrashActionButton();

            drawCanvas();

            setTimeout(() => {
                startWaitingPhase();
            }, 3000);
        }

        function cashOutCrash() {
            if (state.crash.gamePhase !== 'RUNNING' || !state.crash.isBetPlaced || state.crash.hasCashedOut) return;

            state.crash.hasCashedOut = true;
            const winAmount = Math.floor(state.crash.currentBet * state.crash.multiplier);

            state.balance += winAmount;
            soundFX.playWin();
            triggerHaptic('notification', 'success');
            showToast(winAmount, state.crash.multiplier);

            addGlobalLiveFeedItem(userProfile.name, 'Краш', state.crash.currentBet, state.crash.multiplier, winAmount);

            updateBalanceDisplay();
            updateCrashActionButton();
            DOM.livePayoutPreview.classList.add('hidden');
        }

        function updateCrashActionButton() {
            const btn = DOM.crashActionButton;

            if (state.crash.gamePhase === 'WAITING') {
                if (state.crash.isBetPlaced) {
                    btn.className = "w-full py-3.5 rounded-xl bg-gray-800 text-rose-400 border border-rose-500/30 font-black text-sm tracking-wider uppercase transition cursor-pointer";
                    btn.innerHTML = `<i class="fa-solid fa-xmark"></i> <span>ОТМЕНИТЬ СТАВКУ</span>`;
                } else {
                    btn.className = "gradient-button w-full py-3.5 rounded-xl text-white font-black text-sm tracking-wider uppercase shadow-neon-pink cursor-pointer";
                    btn.innerHTML = `<i class="fa-solid fa-star"></i> <span>СДЕЛАТЬ СТАВКУ</span>`;
                }
                btn.disabled = false;
            } else if (state.crash.gamePhase === 'RUNNING') {
                if (state.crash.isBetPlaced && !state.crash.hasCashedOut) {
                    btn.className = "gradient-button-success w-full py-3.5 rounded-xl text-white font-black text-sm tracking-wider uppercase shadow-neon-green cursor-pointer animate-pulse";
                    btn.innerHTML = `<i class="fa-solid fa-gift"></i> <span>ЗАБРАТЬ ЗВЁЗДЫ</span>`;
                    btn.disabled = false;
                } else if (state.crash.hasCashedOut) {
                    btn.className = "w-full py-3.5 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 font-black text-sm tracking-wider uppercase opacity-80 cursor-not-allowed";
                    btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>ЗАБРАНО</span>`;
                    btn.disabled = true;
                } else {
                    btn.className = "w-full py-3.5 rounded-xl bg-cardBorder text-gray-500 font-black text-sm tracking-wider uppercase opacity-60 cursor-not-allowed";
                    btn.innerHTML = `<span>ИГРА ИДЕТ</span>`;
                    btn.disabled = true;
                }
            } else if (state.crash.gamePhase === 'CRASHED') {
                btn.className = "w-full py-3.5 rounded-xl bg-cardBorder text-gray-500 font-black text-sm tracking-wider uppercase opacity-60 cursor-not-allowed";
                btn.innerHTML = `<span>РАУНД ЗАВЕРШЕН</span>`;
                btn.disabled = true;
            }
        }

        function initMinesGrid() {
            DOM.minesGrid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const tile = document.createElement('button');
                tile.className = "mine-tile w-full aspect-square bg-darkBg border border-cardBorder rounded-xl flex items-center justify-center text-xl font-black text-white hover:border-accentPrimary transition";
                tile.dataset.index = i;
                tile.innerHTML = `<i class="fa-solid fa-box-open text-purple-900/40 text-base"></i>`;
                
                tile.addEventListener('click', () => onMineTileClick(i));
                DOM.minesGrid.appendChild(tile);
            }
        }

        function calculateMinesMultiplier(revealedGifts, mineCount) {
            const total = 25;
            let mult = 1.0;
            for (let i = 0; i < revealedGifts; i++) {
                mult *= (total - i) / (total - mineCount - i);
            }
            return parseFloat((mult * 0.97).toFixed(2)); // 3% house edge
        }

        function startMinesGame() {
            const bet = parseInt(DOM.minesBetAmount.value, 10);
            const minesCount = parseInt(DOM.minesCountSelect.value, 10);

            if (isNaN(bet) || bet < 1) return;
            if (bet > state.balance) {
                alert("Недостаточно Telegram Звёзд на балансе!");
                return;
            }

            soundFX.playBeep(600, 0.05);
            triggerHaptic('impact', 'medium');

            state.balance -= bet;
            updateBalanceDisplay();

            state.mines.isPlaying = true;
            state.mines.betAmount = bet;
            state.mines.mineCount = minesCount;
            state.mines.revealedCount = 0;
            state.mines.multiplier = 1.00;
            state.mines.revealed = Array(25).fill(false);

            // Generate Grid with Mines
            state.mines.grid = Array(25).fill(false);
            let placed = 0;
            while (placed < minesCount) {
                const idx = Math.floor(Math.random() * 25);
                if (!state.mines.grid[idx]) {
                    state.mines.grid[idx] = true;
                    placed++;
                }
            }

            // Reset UI Grid
            initMinesGrid();
            DOM.minesMultiplierBadge.textContent = "1.00x";
            DOM.minesCountSelect.disabled = true;
            DOM.minesBetAmount.disabled = true;

            updateMinesActionButton();
        }

        function onMineTileClick(index) {
            if (!state.mines.isPlaying || state.mines.revealed[index]) return;

            state.mines.revealed[index] = true;
            const tileBtn = DOM.minesGrid.children[index];

            if (state.mines.grid[index]) {
                // Hit Bomb
                soundFX.playCrash();
                triggerHaptic('notification', 'error');

                tileBtn.className = "mine-tile revealed-bomb w-full aspect-square rounded-xl flex items-center justify-center text-rose-400 text-2xl border";
                tileBtn.innerHTML = `<i class="fa-solid fa-bomb"></i>`;

                // Reveal all remaining
                revealAllMines();

                addGlobalLiveFeedItem(userProfile.name, 'Мины', state.mines.betAmount, state.mines.multiplier, 0);

                state.mines.isPlaying = false;
                DOM.minesCountSelect.disabled = false;
                DOM.minesBetAmount.disabled = false;
                updateMinesActionButton();
            } else {
                // Found Gift / Star
                soundFX.playBeep(700, 0.06);
                triggerHaptic('impact', 'light');

                state.mines.revealedCount++;
                state.mines.multiplier = calculateMinesMultiplier(state.mines.revealedCount, state.mines.mineCount);

                tileBtn.className = "mine-tile revealed-gift w-full aspect-square rounded-xl flex items-center justify-center text-amber-300 text-2xl border";
                tileBtn.innerHTML = `<i class="fa-solid fa-star"></i>`;

                DOM.minesMultiplierBadge.textContent = state.mines.multiplier.toFixed(2) + 'x';

                updateMinesActionButton();
            }
        }

        function revealAllMines() {
            for (let i = 0; i < 25; i++) {
                if (!state.mines.revealed[i]) {
                    const tileBtn = DOM.minesGrid.children[i];
                    tileBtn.disabled = true;
                    if (state.mines.grid[i]) {
                        tileBtn.className = "mine-tile opacity-60 w-full aspect-square bg-rose-950/40 border border-rose-800/40 rounded-xl flex items-center justify-center text-rose-400 text-xl";
                        tileBtn.innerHTML = `<i class="fa-solid fa-bomb"></i>`;
                    } else {
                        tileBtn.className = "mine-tile opacity-40 w-full aspect-square bg-darkBg border border-cardBorder rounded-xl flex items-center justify-center text-gray-600 text-base";
                        tileBtn.innerHTML = `<i class="fa-solid fa-star"></i>`;
                    }
                }
            }
        }

        function cashOutMines() {
            if (!state.mines.isPlaying || state.mines.revealedCount === 0) return;

            const winAmount = Math.floor(state.mines.betAmount * state.mines.multiplier);
            state.balance += winAmount;

            soundFX.playWin();
            triggerHaptic('notification', 'success');

            addGlobalLiveFeedItem(userProfile.name, 'Мины', state.mines.betAmount, state.mines.multiplier, winAmount);

            state.mines.isPlaying = false;
            revealAllMines();

            DOM.minesCountSelect.disabled = false;
            DOM.minesBetAmount.disabled = false;

            updateBalanceDisplay();
            updateMinesActionButton();
        }

        function updateMinesActionButton() {
            const btn = DOM.minesActionButton;

            if (!state.mines.isPlaying) {
                btn.className = "gradient-button w-full py-3.5 rounded-xl text-white font-black text-sm tracking-wider uppercase shadow-neon-pink cursor-pointer flex items-center justify-center gap-2";
                btn.innerHTML = `<i class="fa-solid fa-play"></i> <span>НАЧАТЬ ИГРУ</span>`;
            } else {
                if (state.mines.revealedCount === 0) {
                    btn.className = "w-full py-3.5 rounded-xl bg-cardBorder text-gray-400 font-black text-sm tracking-wider uppercase opacity-70 cursor-not-allowed flex items-center justify-center gap-2";
                    btn.innerHTML = `<span>ОТКРОЙТЕ ПЕРВУЮ МИНУ</span>`;
                } else {
                    const winVal = Math.floor(state.mines.betAmount * state.mines.multiplier);
                    btn.className = "gradient-button-success w-full py-3.5 rounded-xl text-white font-black text-sm tracking-wider uppercase shadow-neon-green cursor-pointer flex items-center justify-center gap-2 animate-pulse";
                    btn.innerHTML = `<i class="fa-solid fa-gift"></i> <span>ЗАБРАТЬ ⭐ ${winVal} (${state.mines.multiplier.toFixed(2)}x)</span>`;
                }
            }
        }

        function renderLeaderboard() {
            DOM.leaderboardList.innerHTML = '';
            state.leaderboard.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = "flex justify-between items-center p-2.5 rounded-xl bg-darkBg border border-cardBorder text-xs";
                
                const rankIcons = ['🥇', '🥈', '🥉'];
                const rankDisplay = index < 3 ? rankIcons[index] : `#${index + 1}`;

                row.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="text-base font-black w-6 text-center">${rankDisplay}</span>
                        <span class="font-bold text-gray-200">${item.name}</span>
                    </div>
                    <div class="font-black text-amber-300 flex items-center gap-1">
                        ⭐ ${item.stars.toLocaleString('ru-RU')}
                    </div>
                `;
                DOM.leaderboardList.appendChild(row);
            });
        }

        function generateRandomGlobalBets() {
            setInterval(() => {
                const name = state.botNames[Math.floor(Math.random() * state.botNames.length)];
                const game = Math.random() > 0.5 ? 'Краш' : 'Мины';
                const bet = [10, 50, 100, 200, 500][Math.floor(Math.random() * 5)];
                const isWin = Math.random() > 0.4;
                const mult = isWin ? parseFloat((1.2 + Math.random() * 5).toFixed(2)) : 0;
                const win = isWin ? bet * mult : 0;

                addGlobalLiveFeedItem(name, game, bet, mult, win);

                // Update online count randomly
                const online = 1400 + Math.floor(Math.random() * 150);
                DOM.globalOnlineCounter.textContent = `Онлайн: ${online.toLocaleString('ru-RU')} чел.`;
            }, 3500);
        }

        function setupEventListeners() {

            // Crash Action Button
            DOM.crashActionButton.addEventListener('click', () => {
                soundFX.playBeep(600, 0.05);

                if (state.crash.gamePhase === 'WAITING') {
                    if (state.crash.isBetPlaced) {
                        state.balance += state.crash.currentBet;
                        state.crash.isBetPlaced = false;
                        updateBalanceDisplay();
                        updateCrashActionButton();
                    } else {
                        const amount = parseInt(DOM.crashBetAmount.value, 10);
                        if (isNaN(amount) || amount < 1) return;
                        if (amount > state.balance) {
                            alert("Недостаточно Telegram Звёзды на балансе!");
                            return;
                        }

                        state.crash.currentBet = amount;
                        state.balance -= amount;
                        state.crash.isBetPlaced = true;
                        updateBalanceDisplay();
                        updateCrashActionButton();
                    }
                } else if (state.crash.gamePhase === 'RUNNING') {
                    if (state.crash.isBetPlaced && !state.crash.hasCashedOut) {
                        cashOutCrash();
                    }
                }
            });

            // Quick Crash Bets
            DOM.quickCrashBetBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    soundFX.playBeep(500, 0.04);
                    let current = parseInt(DOM.crashBetAmount.value, 10) || 0;
                    const action = e.currentTarget.dataset.action;
                    const val = parseInt(e.currentTarget.dataset.value, 10);

                    if (action === 'add') current += val;
                    if (action === 'max') current = Math.floor(state.balance);

                    current = Math.max(1, Math.min(10000, current));
                    DOM.crashBetAmount.value = current;
                });
            });

            // Auto cashout toggle
            DOM.autoCashoutToggle.addEventListener('change', (e) => {
                state.crash.autoCashoutEnabled = e.target.checked;
                if (state.crash.autoCashoutEnabled) {
                    DOM.autoCashoutContainer.classList.remove('opacity-50', 'pointer-events-none');
                } else {
                    DOM.autoCashoutContainer.classList.add('opacity-50', 'pointer-events-none');
                }
            });

            DOM.autoCashoutValue.addEventListener('input', (e) => {
                let val = parseFloat(e.target.value) || 1.01;
                state.crash.autoCashoutMultiplier = Math.max(1.01, val);
            });

            // Mines Action Button
            DOM.minesActionButton.addEventListener('click', () => {
                if (!state.mines.isPlaying) {
                    startMinesGame();
                } else {
                    if (state.mines.revealedCount > 0) {
                        cashOutMines();
                    }
                }
            });

            // Reset balance
            DOM.resetBalanceBtn.addEventListener('click', () => {
                soundFX.playBeep(800, 0.05);
                state.balance = CONFIG.initialBalance;
                updateBalanceDisplay();
            });

            // Sound Toggle
            DOM.soundToggleBtn.addEventListener('click', () => {
                CONFIG.soundEnabled = !CONFIG.soundEnabled;
                DOM.soundIcon.className = CONFIG.soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark text-rose-500";
            });

            window.addEventListener('resize', () => {
                resizeCanvas();
                drawCanvas();
            });
        }

        window.onload = function () {
            setupTabNavigation();
            resizeCanvas();
            renderCrashHistory();
            initMinesGrid();
            renderLeaderboard();
            updateBalanceDisplay();
            setupEventListeners();
            startWaitingPhase();
            generateRandomGlobalBets();
            drawCanvas();
        };

    </script>
</body>
</html>
